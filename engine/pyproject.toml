[project]
name = "saarthi-engine"
version = "0.1.0"
description = "Deterministic eligibility rules, question picker and optimiser for Saarthi"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saarthi_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
